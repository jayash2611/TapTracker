<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1c2130">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tap Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#1c2130;--card:#262c3e;--ink:#e4eaf6;--mute:#97a2bb;--line:#363e55;--acc:#9cc3f5;--onacc:#16203a;--bad:#f2a3a3;--good:#a4dfc4;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Telugu",sans-serif;line-height:1.4}
main{max-width:480px;margin:0 auto;padding:12px 16px 150px}
button,input,select{font:inherit;color:inherit}
.top{display:flex;justify-content:flex-end;margin-bottom:10px}
.top select{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px}
.hero{background:var(--acc);color:var(--onacc);border-radius:24px;padding:20px}
.hero .big{font-size:3.2rem;font-weight:800;line-height:1}
.hero .sub{opacity:.8;margin-top:6px}
.undo{display:block;width:100%;margin-top:12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:14px;padding:12px;font-weight:600;cursor:pointer}
.undo:disabled{opacity:.35;cursor:default}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:12px}
.nm{flex:1;min-width:0}.nm b{display:block;font-size:1.1rem}.nm span{color:var(--mute);font-size:.9rem}
.plus{position:relative;width:76px;height:76px;border-radius:50%;border:0;background:var(--acc);font-size:2.3rem;cursor:pointer;line-height:1}
.plus:active{transform:scale(.92)}
.plus small{position:absolute;right:-2px;top:-2px;background:var(--bg);color:var(--acc);border:1px solid var(--acc);border-radius:99px;font-size:.7rem;font-weight:800;padding:1px 6px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));max-width:456px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px;display:none}
.toast.on{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid currentColor;background:transparent;border-radius:99px;padding:5px 12px;cursor:pointer;color:inherit}
.chip.sel{background:var(--bg);color:var(--ink)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:16px 0;color:var(--mute);font-weight:600;cursor:pointer}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}
.card h2{margin:0 0 8px;font-size:1rem;color:var(--mute);font-weight:600}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.num{font-size:1.6rem;font-weight:800}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px}
.bars div{flex:1;text-align:center;font-size:.75rem;color:var(--mute)}
.bars i{display:block;background:var(--acc);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:4px}
.bad{color:var(--bad)}.good{color:var(--good)}
.in{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px;width:100%;margin-bottom:8px}
.btn{border:0;background:var(--acc);color:var(--onacc);border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer}
.link{border:0;background:none;color:var(--bad);cursor:pointer}
.empty,.note{color:var(--mute);font-size:.9rem}
.hide{display:none}
</style>
</head>
<body>
<main>
<div class="top"><select id="lang" aria-label="Language"><option value="hi">हिन्दी</option><option value="en">English</option><option value="mr">मराठी</option><option value="ta">தமிழ்</option><option value="te">తెలుగు</option></select></div>
<section id="t-today">
 <div class="hero"><div id="lSpent"></div><div class="big" id="dMoney">₹0</div><div class="sub" id="dCount"></div></div>
 <button class="undo" id="undoBtn"></button>
 <div id="items"></div>
</section>
<section id="t-ins" class="hide">
 <div class="card"><h2 id="hBars"></h2><div class="bars" id="bars"></div></div>
 <div class="card"><div id="periods"></div></div>
 <div class="card"><h2 id="hCmp"></h2><div id="cmp"></div></div>
 <div class="card"><h2 id="hTrig"></h2><div id="trig"></div></div>
 <div class="card"><h2 id="hProj"></h2><div id="proj"></div></div>
 <div class="card"><h2 id="hHist"></h2><div id="hist"></div></div>
</section>
<section id="t-set" class="hide">
 <div id="manage"></div>
 <div class="card"><h2 id="hNew"></h2>
  <select class="in" id="nIcon"></select>
  <input class="in" id="nName"><input class="in" id="nPrice" type="number" inputmode="decimal">
  <button class="btn" id="addItem"></button></div>
 <div class="card"><h2 id="hHome"></h2><div class="note" id="homeN" style="margin-bottom:8px"></div><button class="btn" id="homeB"></button></div>
 <div class="card"><h2 id="hData"></h2><div class="note" id="dataN" style="margin-bottom:8px"></div><button class="btn" id="exp"></button></div>
</section>
</main>
<div class="toast" id="toast"><div id="toastMsg"></div><div class="chips" id="chips"></div></div>
<nav><button data-t="today" class="on" id="nA"></button><button data-t="ins" id="nI"></button><button data-t="set" id="nS"></button></nav>

 var days=[],mx=1;for(var i=6;i>=0;i--){var a=t0-i*DAY,r=range(a,a+DAY);days.push({d:new Date(a),m:r.m});mx=Math.max(mx,r.m)}
 $("#bars").innerHTML=days.map(function(x){return'<div><i style="height:'+Math.round(x.m/mx*80)+'px"></i>'+x.d.toLocaleDateString(t.loc,{weekday:"short"})+'</div>'}).join("");
 var w=range(t0-6*DAY,t0+DAY),pw=range(t0-13*DAY,t0-6*DAY),mo=new Date();mo.setDate(1);mo.setHours(0,0,0,0);var m=range(mo.getTime(),t0+DAY);
 $("#periods").innerHTML='<div class="row"><span>'+t.r7+'</span><b>'+w.c+' · '+rs(w.m)+'</b></div><div class="row"><span>'+t.month+'</span><b>'+m.c+' · '+rs(m.m)+'</b></div>';
 var df=pw.m-w.m;
 $("#cmp").innerHTML=pw.c+w.c===0?'<div class="empty">'+t.nodata+'</div>':df>=0?'<div class="num good">'+rs(df)+' '+t.saved+'</div>':'<div class="num bad">'+rs(-df)+' '+t.more+'</div>';
 var tc={},tot=0;S.logs.forEach(function(l){if(l.tag){tc[l.tag]=(tc[l.tag]||0)+1;tot++}});
 var ks=Object.keys(tc).sort(function(a,b){return tc[b]-tc[a]});
 $("#trig").innerHTML=ks.length?ks.map(function(k){return'<div class="row"><span>'+(t[k]||esc(k))+'</span><b>'+Math.round(tc[k]/tot*100)+'%</b></div>'}).join(""):'<div class="empty">'+t.tagHint+'</div>';
 var dl=w.m/7;
 $("#proj").innerHTML=dl?[["m1",30],["y1",365],["y5",1825]].map(function(p){return'<div class="row"><span>'+t[p[0]]+'</span><b>'+rs(dl*p[1])+'</b></div>'}).join(""):'<div class="empty">'+t.nodata+'</div>';
 var h=S.logs.slice(-15).reverse();
 $("#hist").innerHTML=h.length?h.map(function(l){var d=new Date(l.ts),it=S.items.find(function(i){return i.id===l.item});return'<div class="row"><span>'+(it?it.icon+' ':'')+esc(l.k?t[l.k]:l.name)+(l.tag?' · '+(t[l.tag]||esc(l.tag)):'')+'<br><small class="note">'+d.toLocaleDateString(t.loc,{day:"numeric",month:"short"})+' '+d.toLocaleTimeString(t.loc,{hour:"2-digit",minute:"2-digit"})+'</small></span><span>'+rs(l.price)+' <button class="link" data-del="'+l.id+'">×</button></span></div>'}).join(""):'<div class="empty">'+t.noEntry+'</div>';
 $("#manage").innerHTML=S.items.map(function(it){return'<div class="card"><b>'+esc(nm(it))+'</b><div style="display:flex;gap:8px;margin-top:8px"><select class="in" style="width:72px;margin:0" data-icon="'+it.id+'">'+opts(it.icon)+'</select><input class="in" style="margin:0" type="number" inputmode="decimal" value="'+it.price+'" data-price="'+it.id+'"><button class="link" data-rm="'+it.id+'">'+t.del+'</button></div></div>'}).join("")}
document.addEventListener("click",function(e){var el=e.target.closest("[data-add],[data-del],[data-rm]");if(!el)return;
 var a=el.getAttribute("data-add"),d=el.getAttribute("data-del"),r=el.getAttribute("data-rm");
 if(a)add(+a);
 if(d){S.logs=S.logs.filter(function(l){return l.id!==+d});save();render()}
 if(r&&confirm(T().confirm)){S.items=S.items.filter(function(i){return i.id!==+r});save();render()}});
document.addEventListener("change",function(e){var p=e.target.getAttribute("data-price"),c=e.target.getAttribute("data-icon");
 var it=S.items.find(function(i){return i.id===+(p||c)});if(!it)return;
 if(p)it.price=Math.max(0,+e.target.value||0);if(c)it.icon=e.target.value;save();render()});
$("#lang").onchange=function(){S.lang=this.value;save();render()};
$("#addItem").onclick=function(){var n=$("#nName").value.trim();if(!n)return;S.items.push({id:S.next++,name:n,icon:$("#nIcon").value,price:Math.max(0,+$("#nPrice").value||0)});$("#nName").value="";$("#nPrice").value="";save();render()};
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e});
$("#homeB").onclick=function(){if(dp){dp.prompt()}else{alert(T().homeN)}};
$("#exp").onclick=function(){var rows=["date,item,tag,price"].concat(S.logs.map(function(l){return[new Date(l.ts).toISOString(),'"'+(l.k?L.en[l.k]:l.name).replace(/"/g,'""')+'"',l.tag,l.price].join(",")}));
 var a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(rows.join("\n"));a.download="tracker.csv";a.click()};
document.querySelector("nav").addEventListener("click",function(e){var t=e.target.getAttribute("data-t");if(!t)return;
 ["today","ins","set"].forEach(function(k){$("#t-"+k).classList.toggle("hide",k!==t)});
 Array.prototype.forEach.call(this.children,function(b){b.classList.toggle("on",b===e.target)});window.scrollTo(0,0)});

document.addEventListener("visibilitychange",function(){if(!document.hidden)sync()});
window.addEventListener("focus",sync);
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
